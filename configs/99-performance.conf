# /etc/sysctl.d/99-performance.conf
# Virtual Memory, Inotify, and Network Performance Tuning

# 1. Virtual Memory & Swapping
# Keep swappiness at 60 to actively utilize high-speed ZRAM
vm.swappiness = 60

# Prevent kernel from aggressively reclaiming directory and inode cache
vm.vfs_cache_pressure = 50

# Smooth out disk I/O flushes to avoid desktop micro-stuttering
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# 2. Filesystem Watcher Expansion for DevOps & IDEs
# Avoid falling back to CPU polling in large projects
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

# 3. Google TCP BBR Congestion Control
# Fair Queueing packet scheduler
net.core.default_qdisc = fq

# BBR algorithm for improved throughput and lower latency
net.ipv4.tcp_congestion_control = bbr

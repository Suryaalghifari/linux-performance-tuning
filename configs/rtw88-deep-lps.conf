# /etc/modprobe.d/rtw88-deep-lps.conf
# RTL8821CE (HP 14s-dk1xxx) firmware 24.11.0 gagal ACK saat keluar dari deep LPS:
#   "firmware failed to leave lps state" + WARNING di rtw88/ps.c:105, sampai 32x/menit.
# Efek terukur: jitter WiFi ke gateway avg 27.9 ms / max 149.7 ms (LAN: 0.45 ms / 0.7 ms).
# Matikan deep LPS saja; power save ringan tetap jalan.
options rtw88_core disable_lps_deep=Y
